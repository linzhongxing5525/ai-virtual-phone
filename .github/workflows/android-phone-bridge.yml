name: Build Starforest Android phone bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-phone-bridge/**"
      - ".github/workflows/android-phone-bridge.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android-phone-bridge
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: starforest-phone-bridge-apk
          path: android-phone-bridge/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
      - name: Publish stable APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-phone-bridge/app/build/outputs/apk/debug/app-debug.apk starforest-phone-bridge.apk
          gh release view phone-bridge-latest >/dev/null 2>&1 || gh release create phone-bridge-latest --title "Starforest 手机助手" --notes "Android 真实手机只读加密桥接助手。请仅从本仓库下载并按需授权。"
          gh release upload phone-bridge-latest starforest-phone-bridge.apk --clobber
