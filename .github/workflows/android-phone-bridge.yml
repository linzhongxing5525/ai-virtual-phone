name: Build Starforest Android phone bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-phone-bridge/**"
      - ".github/workflows/android-phone-bridge.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android-phone-bridge
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: starforest-phone-bridge-apk
          path: android-phone-bridge/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
